# Edit the email, then: kubectl apply -f cluster-issuer.yaml
# Referenced by deploy/helm/vision-one-mcp/values.yaml's
# ingress.annotations["cert-manager.io/cluster-issuer"].
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: CHANGE-ME@example.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx # change to `traefik` if using k3s's built-in ingress
