# Default values for vision-one-mcp. Override with --set or -f customer-values.yaml.
# Never commit real values for `secrets.*` — pass them at install time.

replicaCount: 2

image:
  repository: ghcr.io/wphillips/vision-one-mcp-python
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# Non-secret configuration, wired into a ConfigMap and read by src/vision_one_mcp/config.py.
config:
  visionOneRegion: us          # one of: us, eu, au, jp, sg, in, mea
  visionOneBaseUrl: ""         # optional override; leave blank to derive from region
  mcpPort: 8000

# Secrets — leave blank here and pass at install time:
#   helm install ... --set secrets.visionOneApiKey=xxx --set secrets.mcpBearerToken=yyy
# or reference an existing Secret via secrets.existingSecretName instead.
secrets:
  visionOneApiKey: ""
  mcpBearerToken: ""
  # If set, the chart uses this pre-created Secret instead of templating one from the
  # values above (keys expected: VISION_ONE_API_KEY, MCP_BEARER_TOKEN). Recommended for
  # production so secrets never pass through `helm history` / values at all.
  existingSecretName: ""

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  # Set to your ingress controller's class. ingress-nginx is assumed by the example
  # annotations below; adjust for Traefik, HAProxy, etc.
  className: nginx
  host: vision-one-mcp.example.com
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
  tls:
    enabled: true
    # Existing TLS secret name. If empty and cert-manager is installed, one is
    # provisioned automatically named "<release-name>-tls".
    secretName: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
