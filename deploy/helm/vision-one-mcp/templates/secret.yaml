{{- if not .Values.secrets.existingSecretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vision-one-mcp.fullname" . }}
  labels:
    {{- include "vision-one-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  VISION_ONE_API_KEY: {{ required "secrets.visionOneApiKey (or secrets.existingSecretName) is required" .Values.secrets.visionOneApiKey | quote }}
  MCP_BEARER_TOKEN: {{ required "secrets.mcpBearerToken (or secrets.existingSecretName) is required" .Values.secrets.mcpBearerToken | quote }}
{{- end }}
