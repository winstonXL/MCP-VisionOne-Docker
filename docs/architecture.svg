<svg viewBox="0 0 980 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow-grey" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4B5563" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#D71921" />
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="560" fill="#F8F9FA" />

  <text x="490" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">vision-one-mcp-python: request flow</text>

  <!-- Zone 1: User environment -->
  <g>
    <rect x="20" y="70" width="200" height="420" rx="10" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="5,4" />
    <text x="35" y="92" font-size="13" font-weight="bold" fill="#6B7280">USER ENVIRONMENT</text>

    <rect x="45" y="220" width="150" height="70" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="120" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">Claude Desktop</text>
    <text x="120" y="264" text-anchor="middle" font-size="10" fill="#6B7280">Remote MCP</text>
    <text x="120" y="277" text-anchor="middle" font-size="10" fill="#6B7280">custom connector</text>
  </g>

  <!-- Zone 2: Your infrastructure (Kubernetes) -->
  <g>
    <rect x="260" y="70" width="420" height="420" rx="10" fill="#FFFFFF" stroke="#1A2B4A" stroke-width="1.5" stroke-dasharray="5,4" />
    <text x="275" y="92" font-size="13" font-weight="bold" fill="#1A2B4A">YOUR INFRASTRUCTURE — KUBERNETES (EC2/k3s or customer cluster)</text>

    <rect x="290" y="150" width="150" height="60" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="365" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">Ingress</text>
    <text x="365" y="192" text-anchor="middle" font-size="10" fill="#6B7280">TLS termination</text>

    <rect x="290" y="240" width="150" height="60" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="365" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">Service</text>
    <text x="365" y="282" text-anchor="middle" font-size="10" fill="#6B7280">ClusterIP :8000</text>

    <rect x="500" y="195" width="160" height="90" rx="8" fill="#0E7490" fill-opacity="0.08" stroke="#0E7490" stroke-width="1.5" />
    <text x="580" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#0E7490">vision-one-mcp Pod</text>
    <text x="580" y="236" text-anchor="middle" font-size="10" fill="#374151">FastMCP · Streamable HTTP</text>
    <text x="580" y="250" text-anchor="middle" font-size="10" fill="#374151">Bearer-token middleware</text>
    <text x="580" y="264" text-anchor="middle" font-size="10" fill="#374151">read-only Vision One client</text>

    <rect x="500" y="330" width="160" height="60" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="580" y="356" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">Secret / ConfigMap</text>
    <text x="580" y="372" text-anchor="middle" font-size="10" fill="#6B7280">API key · bearer token · region</text>

    <!-- internal arrows -->
    <line x1="365" y1="210" x2="365" y2="240" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow-grey)" />
    <line x1="440" y1="270" x2="500" y2="240" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow-grey)" />
    <line x1="580" y1="330" x2="580" y2="285" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow-grey)" />
  </g>

  <!-- Zone 3: Vision One Cloud -->
  <g>
    <rect x="720" y="70" width="240" height="420" rx="10" fill="#D71921" fill-opacity="0.06" stroke="#D71921" stroke-width="1.5" stroke-dasharray="5,4" />
    <text x="735" y="92" font-size="13" font-weight="bold" fill="#D71921">TREND VISION ONE (CLOUD)</text>

    <rect x="745" y="150" width="190" height="60" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="840" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">Workbench</text>
    <text x="840" y="192" text-anchor="middle" font-size="10" fill="#6B7280">/v3.0/workbench/alerts</text>

    <rect x="745" y="240" width="190" height="60" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="840" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">Threat Intelligence</text>
    <text x="840" y="282" text-anchor="middle" font-size="10" fill="#6B7280">/v3.0/threatintel/*</text>

    <text x="840" y="340" text-anchor="middle" font-size="10" fill="#6B7280">api.&lt;region&gt;.xdr.trendmicro.com</text>
  </g>

  <!-- Cross-zone arrows -->
  <line x1="195" y1="255" x2="290" y2="180" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow-grey)" />
  <text x="242" y="205" text-anchor="middle" font-size="10" fill="#374151">HTTPS 443</text>
  <text x="242" y="218" text-anchor="middle" font-size="10" fill="#374151">Authorization: Bearer &lt;token&gt;</text>

  <line x1="660" y1="230" x2="745" y2="180" stroke="#D71921" stroke-width="2" marker-end="url(#arrow-red)" />
  <line x1="745" y1="270" x2="660" y2="240" stroke="#D71921" stroke-width="2" marker-end="url(#arrow-red)" />
  <text x="700" y="200" text-anchor="middle" font-size="10" fill="#374151">HTTPS 443</text>
  <text x="700" y="313" text-anchor="middle" font-size="10" fill="#374151">Authorization: Bearer &lt;api key&gt;</text>

  <!-- Legend -->
  <g>
    <rect x="45" y="420" width="14" height="14" fill="#FFFFFF" stroke="#6B7280" />
    <text x="65" y="431" font-size="11" fill="#374151">Client (Claude Desktop)</text>

    <rect x="45" y="445" width="14" height="14" fill="#0E7490" fill-opacity="0.15" stroke="#0E7490" />
    <text x="65" y="456" font-size="11" fill="#374151">This project's service (read-only)</text>

    <rect x="45" y="470" width="14" height="14" fill="#D71921" fill-opacity="0.1" stroke="#D71921" />
    <text x="65" y="481" font-size="11" fill="#374151">Vision One cloud APIs</text>
  </g>
</svg>
